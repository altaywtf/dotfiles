[tools]
node = "24.21.0"
bun = "1.4.2"
python = "3.14.8"
java = "temurin-25"
ruby = "4.0.7"
uv = "0.12.23"
go = "1.27.1"
pnpm = "12.7.0"
# rustup-managed toolchain. mise honors a repository's rust-toolchain.toml only
# because "rust" is in idiomatic_version_file_enable_tools in config.toml.tmpl.
rust = "1.99.0"
# 0.1.19 dropped npm trusted-publisher metadata and provenance.
"npm:@playwright/cli" = "0.1.18"
# Coding agents share one pin on every platform. Cursor keeps its own installer.
"npm:@openai/codex" = "0.160.0"
# T3 Code's CLI installs its background service; the service updates itself.
"npm:t3" = "0.0.45"
"npm:@xai-official/grok" = "1.0.46"

gh = "2.102.0"
jq = "1.8.2"
ripgrep = "15.2.0"
shellcheck = "0.11.0"
actionlint = "1.7.12"
chezmoi = "2.73.0"
direnv = "2.37.1"
gitleaks = "8.30.1"
trufflehog = "3.97.9"
topgrade = "17.12.3"
awscli = "2.37.9"
glab = "1.120.0"
git-filter-repo = "2.47.0"
just = "1.58.0"
cargo-binstall = "1.25.1"
