self-hosted-runner:
  # GitHub-hosted labels newer than actionlint 1.7.12; drop once a release knows them.
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm
paths:
  # actionlint 1.7.12 rejects the concurrency `queue` key; drop once a release knows it.
  "**/.github/workflows/verify.yml":
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
