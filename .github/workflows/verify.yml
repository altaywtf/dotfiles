name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        if: ${{ github.event_name != 'push' }}
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: ".node-version"

      - name: Install verification tools
        if: ${{ github.event_name != 'push' }}
        run: brew install actionlint chezmoi mise shellcheck

      - name: Verify repository
        if: ${{ github.event_name != 'push' }}
        run: ./verify/run.ts --skip-security

      - name: Scan
        if: ${{ !cancelled() }}
        uses: uinaf/.github/.github/actions/scan@2b588469fa5f1ce13502fba8870c74ff285a0130 # v3.0.3

  verify-linux:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    concurrency:
      group: verify-linux-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: ".node-version"

      # GITHUB_TOKEN stays scoped to mise steps: unauthenticated runners exhaust
      # the GitHub API budget. mise lives outside ~/.local/bin so the converge
      # tests keep their PATH stub in front.
      - name: Install mise and the verification tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # renovate: datasource=github-releases depName=jdx/mise
          MISE_VERSION: "v2026.10.1"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL https://mise.run | MISE_INSTALL_PATH="$RUNNER_TEMP/bin/mise" sh
          tools=$(sed -nE 's/^(chezmoi|shellcheck|actionlint|gitleaks) = "([^"]+)"$/\1@\2/p' chezmoi/.chezmoitemplates/mise.toml | tr '\n' ' ')
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/bin/mise" --no-config use --global $tools
          printf '%s\n' "$RUNNER_TEMP/bin" "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          printf 'MISE_DATA_DIR=%s\nMISE_GLOBAL_CONFIG_FILE=%s\n' "$HOME/.local/share/mise" "$HOME/.config/mise/config.toml" >> "$GITHUB_ENV"
          sudo apt-get install -y -qq zsh >/dev/null

      - name: Verify repository
        run: ./verify/run.ts --skip-security

      - name: Preview the developer profile in a fresh home
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          HOME="$home" ./dotfiles diff developer

      - name: Resolve the rendered Linux mise config
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          chezmoi --source chezmoi --destination "$home" --override-data '{"dotfilesProfile":"devbox"}' cat "$home/.config/mise/config.toml" > "$home/mise.toml"
          MISE_GLOBAL_CONFIG_FILE="$home/mise.toml" mise install --dry-run
          MISE_GLOBAL_CONFIG_FILE="$home/mise.toml" mise exec github:uinaf/ffss -- slopguard version

      # chezmoi resolves .chezmoi.homeDir from the real user, and systemd-analyze
      # requires the ExecStart binary, so a stub node lives in the runner's home.
      - name: Verify the rendered systemd user units
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          units="$home/.config/systemd/user"
          mkdir -p "$units" "$HOME/.local/share/mise/installs/node/latest/bin"
          install -m 0755 /dev/null "$HOME/.local/share/mise/installs/node/latest/bin/node"
          for unit in dotfiles-software-update.service dotfiles-software-update.timer; do
            rendered="$(chezmoi --source chezmoi --destination "$home" --override-data '{"dotfilesProfile":"devbox"}' cat "$units/$unit")"
            printf '%s\n' "$rendered" > "$units/$unit"
          done
          systemd-analyze verify "$units/dotfiles-software-update.service" "$units/dotfiles-software-update.timer"

  release:
    name: GitHub Release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
    concurrency:
      group: release-${{ github.repository }}-main
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release bot token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.UINAF_CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.UINAF_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Authorize release writes
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
        run: gh auth setup-git

      - name: Resolve release bot identity
        id: release-bot-identity
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          APP_SLUG: ${{ steps.release-bot.outputs.app-slug }}
        run: |
          set -euo pipefail
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          if [[ ! "$user_id" =~ ^[0-9]+$ ]]; then
            echo "failed to resolve numeric bot user id for ${APP_SLUG}[bot]" >&2
            exit 1
          fi
          echo "user-id=${user_id}" >> "$GITHUB_OUTPUT"

      - name: Create semantic release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: 25.0.9
          extra_plugins: |
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/release-notes-generator@14.1.1
            @semantic-release/github@12.0.10
            conventional-changelog-conventionalcommits@10.2.1
        env:
          GITHUB_TOKEN: ${{ steps.release-bot.outputs.token }}
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.release-bot.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.release-bot-identity.outputs.user-id }}+${{ steps.release-bot.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ steps.release-bot.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.release-bot-identity.outputs.user-id }}+${{ steps.release-bot.outputs.app-slug }}[bot]@users.noreply.github.com
