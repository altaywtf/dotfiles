# Profile runtime pins live in chezmoi/.chezmoitemplates/mise.toml.

# Tasks take Node from .node-version and pnpm from package.json. mise strips
# undeclared tool install paths from the inherited PATH, so a task cannot rely
# on the caller's Node before a profile declares one globally.
[settings]
idiomatic_version_file_enable_tools = ["node", "pnpm"]

[tasks.verify]
description = "Run the complete repository gate"
depends = ["verify:fast", "verify:history"]

[tasks."verify:fast"]
description = "Run every deterministic repository check"
run = "./verify/run.ts --skip-security"

[tasks."verify:history"]
description = "Scan the full Git history for secrets"
hide = true
run = "node ./audit/repo.ts --skip-mscp"

[tasks."verify:domain"]
description = "Run one focused verification domain"
usage = '''
arg "<domain>" help="Verification domain" {
  choices "agents" "audit" "bootstrap" "config" "git" "homebrew" "identity" "maintenance" "profiles" "security" "static"
}
'''
run = './verify/run.ts --domain "$usage_domain"'

[tasks."verify:bootstrap"]
description = "Verify one live profile"
usage = '''
arg "<profile>" help="Profile to verify" {
  choices "developer" "devbox" "workstation" "personal-devbox" "personal-workstation"
}
'''
run = './verify/bootstrap.ts --profile "$usage_profile"'

[tasks."verify:devbox-services"]
description = "Verify live devbox services"
run = "./verify/darwin/devbox-services.ts"

[tasks.audit]
description = "Run one repository or live-host audit"
usage = '''
arg "<scope>" help="Audit scope" {
  choices "repo" "mscp" "host" "workstation" "devbox"
}
flag "--format <format>" help="Output format" default="text" {
  choices "text" "json"
}
'''
run = 'node ./audit/run.ts "$usage_scope" "$usage_format"'

[tasks."maintenance:check"]
description = "Inspect available updates as JSON, refreshing metadata and scan caches"
run = "node ./maintenance/check.ts"

[tasks."maintenance:verify"]
description = "Collect a live-applicability snapshot with full bootstrap verification"
run = "node ./maintenance/check.ts --verify"

[tasks."maintenance:enable"]
description = "Enable six-hour software updates for the current user"
run = "node ./maintenance/schedule.ts enable"

[tasks."maintenance:disable"]
description = "Disable scheduled software updates and stop any current run"
run = "node ./maintenance/schedule.ts disable"

[tasks."maintenance:update"]
description = "Request an on-demand update through the scheduled job"
run = "node ./maintenance/schedule.ts run"

[tasks."maintenance:status"]
description = "Show the updater state, last exit code, and log location"
run = "node ./maintenance/schedule.ts status"

[tasks."dotfiles:apply"]
description = "Apply the repo-local chezmoi source state"
usage = '''
arg "<profile>" help="Profile to apply" {
  choices "developer" "devbox" "workstation" "personal-devbox" "personal-workstation"
}
'''
run = './bootstrap/apply-dotfiles.ts --profile "$usage_profile"'

[tasks."dotfiles:diff"]
description = "Preview the repo-local chezmoi source state"
usage = '''
arg "<profile>" help="Profile to preview" {
  choices "developer" "devbox" "workstation" "personal-devbox" "personal-workstation"
}
'''
run = './bootstrap/apply-dotfiles.ts --profile "$usage_profile" --dry-run --verbose'

[tasks."agents:sync"]
description = "Sync selected global coding-agent skills, plugins, and MCPs"
run = ["./agents/sync.ts", "./agents/plugins.ts", "./agents/mcps.ts"]

[tasks."agents:update"]
description = "Update selected global coding-agent skills and plugins, then sync MCPs"
run = ["./agents/sync.ts --update", "./agents/plugins.ts --update", "./agents/mcps.ts"]

[tasks."agents:doctor"]
description = "Report MCP authentication state per harness with the repair command"
run = "./agents/doctor.ts"

[tasks."xcode:install"]
description = "Install and select the declared Xcode release"
run = "node ./bootstrap/darwin/xcode.ts"

[tasks."xcode:check"]
description = "Verify the selected Xcode matches the declared release pin"
run = "node ./bootstrap/darwin/xcode.ts --check"

[tasks."bootstrap:trust-agent-worktrees"]
description = "Trust mise configs in generated agent worktrees"
run = "./bootstrap/trust-agent-worktrees.ts"

[tasks."maintenance:hygiene"]
description = "Preview host worktree, branch, and cache cleanup"
run = "node ./maintenance/hygiene.ts --dry-run"

[tasks."maintenance:clean"]
description = "Apply eligible host cleanup with a three-day Git grace period"
run = "node ./maintenance/hygiene.ts --apply"
